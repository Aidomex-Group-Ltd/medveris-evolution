# gitleaks configuration
#
# The default rule set is kept in full. The only additions are three allowlists
# for findings that are provably not credentials. Each one is scoped by BOTH a
# path and a regex (condition = "AND"), so it cannot hide a real secret that is
# committed to a different file, and cannot hide a different kind of value in
# the same file.
#
# `gitleaks detect --source .` on the full history found exactly these 14
# findings and nothing else.

title = "Medveris"

[extend]
useDefault = true

# 1. Fake credentials used as *input* to the masking function under test.
#    tests/unit/fx-masking.test.ts feeds literal values into maskFxSecrets() and
#    asserts they are redacted. They are not real: `sk_live_supersecret` is a
#    placeholder, and the file exists precisely to prove such strings never
#    reach a log. Allowlisting the exact literals keeps the rest of the file
#    (and every other file) scanned.
[[allowlists]]
description = "FX masking test fixtures: placeholder values passed to maskFxSecrets()"
condition = "AND"
paths = ['''tests/unit/fx-masking\.test\.ts$''']
regexes = ['''^(sk_live_supersecret|abcDEF1234567890)$''']

# 2. SHA-256 checksums of tracked documents. The generic-api-key rule fires on
#    `"<file>": "<64 hex chars>"`. Restricting the regex to a bare 64-character
#    lowercase hex string means a real API key committed to this file (which
#    would contain other characters) is still reported.
[[allowlists]]
description = "SHA256SUMS.json: SHA-256 digests of tracked documents"
condition = "AND"
paths = ['''^SHA256SUMS\.json$''']
regexes = ['''^[0-9a-f]{64}$''']

# 3. Report column identifiers. The rule fires on `{ key: "queue", ... }` in the
#    report catalogue. Only lowercase-leading camelCase identifiers are allowed;
#    a credential pasted into this file (AWS keys start uppercase, provider
#    tokens contain mixed case or punctuation) still matches.
[[allowlists]]
description = "report definitions: column key identifiers"
condition = "AND"
paths = ['''apps/api/src/reports/definitions\.ts$''']
regexes = ['''^[a-z][A-Za-z0-9]{3,40}$''']
