name: CI
#
# Pull requests run the existing install, lint, test and build checks. Install Playwright’s
# browser version using a runner OS supported by the Playwright version in the lockfile.
#
# Deployments are intentionally separate from this file:
#   - Staging is automated from the repository’s established staging branch (see `.github/workflows/deploy-staging.yml`).
#   - Production is a separate workflow with a required manual approval environment (see `.github/workflows/deploy-production.yml`).
#
# These deployment workflows reuse the existing Cloudflare Workers scripts and Wrangler config:
#   - `wrangler.jsonc` top level is local `wrangler dev` only.
#   - `env.staging` → Worker `medveris-staging`, database `medveris_staging`, origin
#     `https://medveris-staging.aidomexgroupltd.workers.dev`, secret set rooted in
#     `~/.config/medveris/staging/` (outside the repository).
#   - `env.production` → Worker `medveris-production`, database `medveris-prod`, apex
#     `medveris.online` (attached only after `npm run domain:production`), secret set rooted in
#     `~/.config/medveris/production/` (outside the repository).
#
# Never commit secret values. Configure GitHub Environments and Cloudflare secrets/Wrangler tokens
# separately for staging and production; the workflows do not pass secrets as arguments.

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      APP_ENV: test
      APP_ORIGIN: http://localhost:5173
      DEV_SHOW_TOTP_SECRETS: "true"
      PGADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
      MIGRATION_DATABASE_URL: postgres://medveris_migrator:medveris_migrator_dev@localhost:5432/medveris_test
      DATABASE_URL: postgres://medveris_runtime:medveris_runtime_dev@localhost:5432/medveris_test
      JOBS_DATABASE_URL: postgres://medveris_jobs:medveris_jobs_dev@localhost:5432/medveris_test
      SESSION_SECRET: ci-session-secret-ci-session-secret
      MFA_ENCRYPTION_KEY: ci-mfa-encryption-key-ci-mfa-encryption-key
      AUDIT_SIGNING_KEY: ci-audit-signing-key-ci-audit-signing-key
      AUDIT_SIGNING_KEY_ID: ci-key-1
      TERMINOLOGY_MODE: synthetic
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Runtime dependency audit
        run: npm audit --omit=dev --audit-level=high
      - run: npm run db:setup
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run smoke:workers
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan full history for secrets
        run: gitleaks detect --source . --config .gitleaks.toml --redact --no-banner --exit-code 1
