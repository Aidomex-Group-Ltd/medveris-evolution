name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      APP_ENV: test
      APP_ORIGIN: http://localhost:5173
      DEV_SHOW_TOTP_SECRETS: "true"
      PGADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
      MIGRATION_DATABASE_URL: postgres://medveris_migrator:medveris_migrator_dev@localhost:5432/medveris_dev
      DATABASE_URL: postgres://medveris_runtime:medveris_runtime_dev@localhost:5432/medveris_dev
      JOBS_DATABASE_URL: postgres://medveris_jobs:medveris_jobs_dev@localhost:5432/medveris_dev
      SESSION_SECRET: ci-session-secret-ci-session-secret
      MFA_ENCRYPTION_KEY: ci-mfa-encryption-key-ci-mfa-encryption-key
      AUDIT_SIGNING_KEY: ci-audit-signing-key-ci-audit-signing-key
      AUDIT_SIGNING_KEY_ID: ci-key-1
      TERMINOLOGY_MODE: synthetic
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Blocking: high/critical runtime advisories must not reach the released tree.
      - name: Runtime dependency audit
        run: npm audit --omit=dev --audit-level=high
      - run: npm run db:setup
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run smoke:workers
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      # Scans the commits being introduced rather than all of history: the
      # history predating this gate has 14 known false positives (fake keys in
      # tests/unit/fx-masking.test.ts, digests in SHA256SUMS.json, and a report
      # definition), so a full-history scan would fail every run. Findings in
      # new commits fail the job.
      - name: Scan pushed commits for secrets
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$BASE_SHA" ]; then
            RANGE="$BASE_SHA..$HEAD_SHA"
          elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            RANGE="$BEFORE_SHA..$HEAD_SHA"
          else
            RANGE="-n 1"
          fi
          echo "gitleaks commit range: $RANGE"
          gitleaks detect --source . --log-opts "$RANGE" --redact --no-banner --exit-code 1
