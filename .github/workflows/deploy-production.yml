name: Deploy production
#
# Production deploys only through the established release process, with a required manual
# approval gate. This workflow does not run on push or pull requests. Trigger it manually
# after reviewing staging evidence for the same commit.
#
# The repository's production release command is `npm run deploy:production`
# (scripts/production-deploy.mjs without --dry-run). It runs the full gate, then a
# verified blue-green release with health, readiness, version metadata and smoke checks.
# `npm run deploy:production:check` is a read-only readiness check only and is NOT a deploy.
#
# Artifact model: Cloudflare Workers version IDs are scoped to one Worker. Staging and
# production are separate Workers (`medveris-staging` and `medveris-production`), so a
# staging version object cannot be promoted across Workers. Both workflows build from the
# same checked-out commit; production rebuilds and uploads that same commit. No claim of
# cross-Worker artifact promotion is made.
#
# Approval: the `production` GitHub Environment must have required reviewers configured
# (Settings -> Environments -> production -> Required reviewers, preferably with
# "Prevent self-review"). On a public repository this is available on all current GitHub
# plans, including Free. If the repository is made private, required reviewers and
# environment secrets require GitHub Pro/Team/Enterprise. The workflow cannot create these
# rules itself; without them the job starts without approval.

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: "Short note about this production release (what is being promoted and why)."
        required: true

environment:
  name: production
  url: https://medveris.online

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_ACCOUNT_ID: 6337ed24a5f8ff4ec3f74517a55a7e6b
      # Wrangler has no keyless OIDC mode for deploys; use a scoped CI API token.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Runtime dependency audit
        run: npm run audit:runtime
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Prepare production secret files
        env:
          PRODUCTION_SECRETS_ENV: ${{ secrets.PRODUCTION_SECRETS_ENV }}
          PRODUCTION_RESEND_ENV: ${{ secrets.PRODUCTION_RESEND_ENV }}
          PRODUCTION_DB_ENV: ${{ secrets.PRODUCTION_DB_ENV }}
          PRODUCTION_BACKUP_ATTESTATION: ${{ secrets.PRODUCTION_BACKUP_ATTESTATION }}
        run: |
          set -euo pipefail
          for name in PRODUCTION_SECRETS_ENV PRODUCTION_RESEND_ENV PRODUCTION_DB_ENV PRODUCTION_BACKUP_ATTESTATION; do
            test -n "${!name}" || { echo "$name secret is required"; exit 1; }
          done
          dir="$(mktemp -d)"
          umask 077
          printf '%s\n' "$PRODUCTION_SECRETS_ENV" > "$dir/secrets.env"
          printf '%s\n' "$PRODUCTION_RESEND_ENV" > "$dir/resend.env"
          printf '%s\n' "$PRODUCTION_DB_ENV" > "$dir/db.env"
          printf '%s\n' "$PRODUCTION_BACKUP_ATTESTATION" > "$dir/backup-verification.json"
          echo "PRODUCTION_SECRETS_DIR=$dir" >> "$GITHUB_ENV"
      - name: Production release
        run: npm run deploy:production
        env:
          # Runner-local files created above from GitHub secrets; no developer ~/.config
          # directory is used. The script uploads only secrets the Worker lacks.
          # Required GitHub secrets: CLOUDFLARE_API_TOKEN, PRODUCTION_SECRETS_ENV,
          # PRODUCTION_RESEND_ENV, PRODUCTION_DB_ENV, PRODUCTION_BACKUP_ATTESTATION.
          # Required Cloudflare resources: production Hyperdrive configs, R2 bucket
          # medveris-production-uploads and production queues in wrangler.jsonc.
      - name: Release note
        run: |
          set -euo pipefail
          echo "Production release for commit ${{ github.sha }} after environment approval."
          echo "Release notes: ${{ inputs.release_notes }}"
